name: Auto Create Today Post & Update Indexes

on:
  workflow_dispatch: # 允许在 GitHub 后台手动触发
  schedule:
    - cron: '0 1 * * *' # 上海时间每天上午 9:00 自动运行

jobs:
  create-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行脚本生成文章、更新内容及索引
        run: |
          python - << 'EOF'
          import os
          import glob
          import datetime
          import re
          import random

          posts_dir = "free-nodes"
          if not os.path.exists(posts_dir):
              print(f"Directory {posts_dir} not found.")
              exit(1)

          # 获取当天的日期
          today = datetime.date.today()
          today_year = today.strftime('%Y')
          today_month_no_zero = str(today.month)
          today_month_zero = today.strftime('%m')
          today_day_no_zero = str(today.day)
          today_day_zero = today.strftime('%d')
          
          # 新文件名及正文统一使用的无补零日期格式 (例如: 2026-9-20)
          today_file_date_str = f"{today_year}-{today_month_no_zero}-{today_day_no_zero}"
          today_standard_date_str = f"{today_year}-{today_month_zero}-{today_day_zero}"

          target_chinese_date = f"{today_year}年{today_month_no_zero}月{today_day_no_zero}日"
          target_short_chinese_date = f"{today_month_no_zero}月{today_day_no_zero}日"
          target_slash_date = f"{today_year}/{today_month_no_zero}/{today_day_no_zero}"
          target_compact_date = f"{today_year}{today_month_zero}{today_day_zero}"

          new_basename = ""

          # ----------------- 1. 处理 free-nodes 目录下的最新文章 (.htm) -----------------
          all_files = glob.glob(os.path.join(posts_dir, "*.htm")) + glob.glob(os.path.join(posts_dir, "*.html")) + glob.glob(os.path.join(posts_dir, "*.md"))
          
          valid_files = []
          for file in all_files:
              basename = os.path.basename(file)
              if re.match(r'^\d{4}-\d{1,2}-\d{1,2}', basename):
                  valid_files.append((basename, file))

          if valid_files:
              # 按文件名降序排序，获取最新的文件
              valid_files.sort(key=lambda x: x[0], reverse=True)
              latest_basename, latest_file = valid_files[0]
              print(f"Latest file found: {latest_file}")

              # 提取旧文件名中的日期
              date_match = re.match(r'^(\d{4})-(\d{1,2})-(\d{1,2})', latest_basename)
              old_year, old_month, old_day = date_match.groups()
              old_date_dash_1 = f"{old_year}-{old_month}-{old_day}"
              old_date_dash_2 = f"{old_year}-{int(old_month):02d}-{int(old_day):02d}"

              if old_date_dash_1 == today_file_date_str or old_date_dash_2 == today_file_date_str:
                  print("The latest post is already dated today. Using today's filename for index check.")
                  new_basename = latest_basename
              else:
                  # 生成新文件名
                  new_basename = latest_basename.replace(old_date_dash_1, today_file_date_str, 1)
                  if new_basename == latest_basename:
                      new_basename = latest_basename.replace(old_date_dash_2, today_file_date_str, 1)
                  
                  new_file = os.path.join(posts_dir, new_basename)

                  if os.path.exists(new_file):
                      print(f"File {new_file} already exists.")
                  else:
                      # 读取上一天的文章内容
                      with open(latest_file, 'r', encoding='utf-8') as f:
                        content = f.read()

                      # 更新文章内容里的日期
                      new_content = re.sub(r'\b20\d{2}-\d{1,2}-\d{1,2}\b', today_file_date_str, content)
                      new_content = re.sub(r'20\d{2}年\d{1,2}月\d{1,2}[日号]', target_chinese_date, new_content)
                      new_content = re.sub(r'\b\d{1,2}月\d{1,2}[日号]', target_short_chinese_date, new_content)
                      new_content = re.sub(r'\b20\d{2}/\d{1,2}/\d{1,2}\b', target_slash_date, new_content)
                      new_content = re.sub(r'\b20\d{2}\d{2}\d{2}\b', target_compact_date, new_content)

                      # 随机替换测速数字
                      def random_speed(match):
                          val = round(random.uniform(10.0, 35.0), 1)
                          suffix = match.group(2)
                          return f"{val}{suffix}"

                      new_content = re.sub(r'\b\d+(\.\d+)?([Mm][Bb]?/[Ss]|[Mm][Bb][Pp][Ss])\b', random_speed, new_content)

                      # 写入新生成的当天文章文件
                      with open(new_file, 'w', encoding='utf-8') as f:
                          f.write(new_content)

                      print(f"Successfully created new post: {new_file} with updated dates and speed")

          # ----------------- 2. 自动更新根目录下的 README.md -----------------
          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, 'r', encoding='utf-8') as f:
                  readme_content = f.read()

              readme_content = re.sub(r'\b20\d{2}-\d{1,2}-\d{1,2}\b', today_file_date_str, readme_content)
              readme_content = re.sub(r'20\d{2}年\d{1,2}月\d{1,2}[日号]', target_chinese_date, readme_content)
              readme_content = re.sub(r'\b\d{1,2}月\d{1,2}[日号]', target_short_chinese_date, readme_content)
              readme_content = re.sub(r'\b20\d{2}/\d{1,2}/\d{1,2}\b', target_slash_date, readme_content)
              readme_content = re.sub(r'\b20\d{2}\d{2}\d{2}\b', target_compact_date, readme_content)

              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write(readme_content)
              print("Successfully updated README.md")

          # ----------------- 3. 自动更新 free-nodes/index.htm (或 index.html) -----------------
          if new_basename:
              for index_name in ["index.htm", "index.html"]:
                  free_nodes_index = os.path.join(posts_dir, index_name)
                  if os.path.exists(free_nodes_index):
                      with open(free_nodes_index, 'r', encoding='utf-8') as f:
                          idx_content = f.read()
                      
                      if new_basename not in idx_content:
                          # 构造要插入的链接HTML条目
                          new_link_html = f'<li><a href="{new_basename}">{target_chinese_date} 免费节点订阅地址</a></li>'
                          if '<ul>' in idx_content:
                              idx_content = idx_content.replace('<ul>', '<ul>\n    ' + new_link_html, 1)
                          elif '<body>' in idx_content:
                              idx_content = idx_content.replace('<body>', '<body>\n    <ul>\n    ' + new_link_html + '\n    </ul>', 1)
                          else:
                              idx_content = new_link_html + '\n' + idx_content

                          with open(free_nodes_index, 'w', encoding='utf-8') as f:
                              f.write(idx_content)
                          print(f"Successfully updated {free_nodes_index}")

          # ----------------- 4. 自动更新根目录下的 index.htm (或 index.html) -----------------
          if new_basename:
              for index_name in ["index.htm", "index.html"]:
                  if os.path.exists(index_name):
                      with open(index_name, 'r', encoding='utf-8') as f:
                          root_idx_content = f.read()
                      
                      sub_path = f"free-nodes/{new_basename}"
                      if sub_path not in root_idx_content and new_basename not in root_idx_content:
                          root_link_html = f'<li><a href="free-nodes/{new_basename}">{target_chinese_date} 免费节点订阅地址</a></li>'
                          if '<ul>' in root_idx_content:
                              root_idx_content = root_idx_content.replace('<ul>', '<ul>\n    ' + root_link_html, 1)
                          elif '<body>' in root_idx_content:
                              root_idx_content = root_idx_content.replace('<body>', '<body>\n    <ul>\n    ' + root_link_html + '\n    </ul>', 1)
                          else:
                              root_idx_content = root_link_html + '\n' + root_idx_content

                          with open(index_name, 'w', encoding='utf-8') as f:
                              f.write(root_idx_content)
                          print(f"Successfully updated root {index_name}")
          EOF

      - name: 提交并推送修改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate post, update dates and indexes"
          branch: main
